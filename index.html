<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nagybani Gastro - Piaci árfigyelő</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; overflow: hidden; }
  #map { width: 100%; height: 100%; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    background: #1b5e20; color: white; padding: 10px 12px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  #topbar input[type=text] {
    flex: 1; min-width: 140px; padding: 10px; border-radius: 6px; border: none; font-size: 16px;
  }
  #topbar button {
    padding: 10px 14px; border: none; border-radius: 6px; background: #ffb300; color: #222;
    font-weight: bold; font-size: 15px; cursor: pointer; white-space: nowrap;
  }
  #topbar button.secondary { background: #43a047; color: white; }
  #topbar button.gps { background: #1976d2; color: white; }

  #status {
    position: absolute; top: 60px; left: 10px; right: 10px; z-index: 10;
    background: rgba(0,0,0,0.75); color: white; padding: 8px 12px; border-radius: 6px;
    font-size: 14px; display: none;
  }

  #panel {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: white; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,0.3);
    max-height: 78vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.25s ease;
    padding: 16px;
  }
  #panel.open { transform: translateY(0); }
  #panel h3 { margin: 0 0 10px; color: #1b5e20; }
  #panel .row { display: flex; gap: 8px; margin-bottom: 10px; }
  #panel input, #panel select { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; }
  #panel table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
  #panel th, #panel td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eee; }
  #panel .closeBtn { position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 22px; color: #999; cursor: pointer; }

  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 15; display: none; }
  #overlay.open { display: block; }

  #listBtn {
    position: absolute; bottom: 16px; right: 16px; z-index: 10;
    background: #1b5e20; color: white; border: none; border-radius: 50%;
    width: 54px; height: 54px; font-size: 22px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); cursor: pointer;
  }

  /* ====== v2.0 DIZÁJN ====== */
  :root {
    --g900:#0b3d20; --g800:#14532d; --g700:#1b6b3a; --g600:#2e8b4f; --g100:#e6f4ea; --g50:#f2f9f4;
    --amber:#ffb300; --amber2:#ff8f00; --pink:#d81b60; --blue:#1a73e8;
    --ink:#16221a; --muted:#6b7a70; --card:#fff; --bg:#f1f6f2; --line:#e3ebe5;
    --shadow:0 6px 24px rgba(16,60,34,.12); --shadow-s:0 2px 8px rgba(16,60,34,.10);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  body { color: var(--ink); -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; }

  /* meglévő elemek új stílusa */
  #topbar { background: linear-gradient(135deg, var(--g900), var(--g700)); padding: 10px 12px; gap: 8px;
    box-shadow: 0 8px 24px rgba(11,61,32,.35); border-radius: 0 0 20px 20px; }
  #topbar input[type=text] { border-radius: 12px; padding: 11px 12px; box-shadow: inset 0 1px 3px rgba(0,0,0,.15); }
  #topbar button { border-radius: 12px; padding: 11px 14px; transition: transform .15s var(--ease), filter .15s; }
  #topbar button:active { transform: scale(.94); filter: brightness(.95); }
  #topbar button.ghost { background: rgba(255,255,255,.16); color: #fff; padding: 11px 12px; }
  #status { z-index: 80; top: 12px; border-radius: 14px; backdrop-filter: blur(8px); background: rgba(16,34,26,.88);
    animation: toastIn .3s var(--ease); box-shadow: var(--shadow); }
  #panel { border-radius: 26px 26px 0 0; padding: 22px 16px 20px; z-index: 50; box-shadow: 0 -10px 40px rgba(0,0,0,.28);
    transition: transform .38s var(--ease); }
  #panel::before { content: ''; position: absolute; top: 8px; left: 50%; width: 44px; height: 5px; margin-left: -22px; border-radius: 3px; background: #d5ddd7; }
  #panel h3 { color: var(--g800); }
  #panel input, #panel select { border-radius: 12px; border: 1.5px solid var(--line); background: #fbfdfb; }
  #panel input:focus, #panel select:focus { outline: none; border-color: var(--g600); box-shadow: 0 0 0 3px rgba(46,139,79,.18); }
  #overlay { z-index: 45; backdrop-filter: blur(2px); animation: fadeIn .25s; }
  #listBtn { z-index: 30; background: linear-gradient(135deg, var(--g800), var(--g600)); box-shadow: var(--shadow); transition: transform .2s var(--ease); }
  #listBtn:active { transform: scale(.9); }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-12px) } to { opacity: 1; transform: none } }

  /* képernyők */
  body:not([data-screen=shop]):not([data-screen=map]) #topbar,
  body:not([data-screen=shop]):not([data-screen=map]) #listBtn,
  body:not([data-screen=shop]):not([data-screen=map]) #shopFab { visibility: hidden; }
  body[data-screen=map] #shopFab { display: none; }
  .screen { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transform: translateY(18px) scale(.985); transition: opacity .35s var(--ease), transform .45s var(--ease); }
  body[data-screen=home] #homeScreen, body[data-screen=list] #listScreen { opacity: 1; pointer-events: auto; transform: none; }

  /* kezdőképernyő */
  #homeScreen { background: radial-gradient(120% 70% at 50% -10%, #1f7a43 0%, var(--g900) 55%, #07281a 100%); color: #fff; overflow: hidden; }
  .home-emojis { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .home-emojis span { position: absolute; font-size: 38px; opacity: .13; animation: floaty 9s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-6deg) } 50% { transform: translateY(-26px) rotate(8deg) } }
  .home-inner { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px 20px 36px; max-width: 520px; width: 100%; margin: 0 auto; gap: 14px; }
  .home-brand { font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; opacity: .75; font-weight: 700; animation: riseIn .6s var(--ease) both; }
  .home-title { font-size: 34px; line-height: 1.1; font-weight: 800; margin: 2px 0 14px; animation: riseIn .6s .08s var(--ease) both; }
  .home-title em { font-style: normal; color: var(--amber); }
  .big-card { width: 100%; border: none; border-radius: 22px; padding: 20px 20px; display: flex; align-items: center; gap: 16px; text-align: left; cursor: pointer;
    background: rgba(255,255,255,.96); color: var(--ink); box-shadow: 0 14px 34px rgba(0,0,0,.28);
    transition: transform .25s var(--ease), box-shadow .25s; animation: riseIn .6s var(--ease) both; }
  .big-card:nth-of-type(1) { animation-delay: .16s } .big-card:nth-of-type(2) { animation-delay: .24s } .big-card:nth-of-type(3) { animation-delay: .32s }
  .big-card:active { transform: scale(.97); }
  .big-card .bc-ico { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; font-size: 30px; background: linear-gradient(135deg, var(--g100), #cfe9d6); flex: none; }
  .big-card b { display: block; font-size: 20px; } .big-card small { color: var(--muted); font-size: 13.5px; }
  .big-card.alt { background: rgba(255,255,255,.12); color: #fff; box-shadow: none; border: 1.5px solid rgba(255,255,255,.25); }
  .big-card.alt .bc-ico { background: rgba(255,255,255,.14); } .big-card.alt small { color: rgba(255,255,255,.7); }
  .big-card.disabled { opacity: .55; pointer-events: none; }
  .resume-card { background: linear-gradient(135deg, var(--amber), var(--amber2)); color: #2a1c00; border-radius: 22px; padding: 16px 18px; display: none; align-items: center; gap: 14px;
    cursor: pointer; box-shadow: 0 12px 30px rgba(255,143,0,.35); animation: riseIn .6s .1s var(--ease) both; border: none; width: 100%; text-align: left; }
  .resume-card.show { display: flex; } .resume-card b { display: block; font-size: 16px; } .resume-card small { opacity: .8; }
  .resume-card .rc-arrow { margin-left: auto; font-size: 24px; font-weight: 800; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(26px) } to { opacity: 1; transform: none } }

  /* lista-összeállító */
  #listScreen { overflow: hidden; }
  .ls-head { background: linear-gradient(135deg, var(--g900), var(--g700)); color: #fff; padding: 12px 14px 12px; border-radius: 0 0 24px 24px; box-shadow: 0 10px 28px rgba(11,61,32,.3); z-index: 3; flex: none; }
  .ls-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ls-top h2 { margin: 0; font-size: 19px; flex: 1; }
  .icon-btn { border: none; background: rgba(255,255,255,.16); color: #fff; border-radius: 12px; padding: 9px 13px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform .15s var(--ease); }
  .icon-btn:active { transform: scale(.92); }
  .ls-search { display: flex; gap: 8px; }
  .ls-search input { flex: 1; border: none; border-radius: 14px; padding: 12px 14px; font-size: 16px; min-width: 0; box-shadow: inset 0 1px 3px rgba(0,0,0,.15); }
  .ls-search input:focus { outline: 3px solid rgba(255,179,0,.6); }
  .ls-search button { border: none; border-radius: 14px; padding: 0 14px; background: var(--amber); color: #2a1c00; font-weight: 800; cursor: pointer; font-size: 14px; white-space: nowrap; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: none; border-radius: 999px; padding: 7px 13px; background: rgba(255,255,255,.14); color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: background .2s, transform .15s; }
  .chip:active { transform: scale(.94); } .chip.on { background: #fff; color: var(--g800); }
  .ls-scroll { flex: 1; overflow-y: auto; padding: 6px 12px 110px; -webkit-overflow-scrolling: touch; }
  .csec { scroll-margin-top: 8px; margin-top: 14px; }
  .csec h3 { margin: 0 0 10px 4px; font-size: 16px; color: var(--g800); display: flex; align-items: center; gap: 8px; }
  .csec h3 span { font-size: 20px; } .csec h3 em { font-style: normal; font-size: 12px; color: var(--muted); background: #e4ece6; padding: 2px 8px; border-radius: 99px; margin-left: auto; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .pcard { position: relative; background: var(--card); border-radius: 18px; padding: 8px 8px 10px; box-shadow: var(--shadow-s); cursor: pointer; border: 2px solid transparent;
    transition: transform .25s var(--ease), border-color .2s, box-shadow .25s; animation: cardIn .45s var(--ease) both; animation-delay: calc(var(--i) * 30ms); user-select: none; }
  .pcard:active { transform: scale(.96); }
  .pcard.selected { border-color: var(--g600); box-shadow: 0 8px 22px rgba(46,139,79,.28); background: var(--g50); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.96) } to { opacity: 1; transform: none } }
  .pimg { position: relative; width: 100%; aspect-ratio: 1; border-radius: 13px; overflow: hidden; background: linear-gradient(135deg, #eef5f0, #dfeee4); display: grid; place-items: center; }
  .pimg .pemo { font-size: 38px; opacity: .85; }
  .pimg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s; }
  .pimg img.loaded { opacity: 1; }
  .pname { font-weight: 700; font-size: 13px; margin-top: 7px; line-height: 1.2; min-height: 31px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .punit { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .pcheck { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: var(--g600); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px;
    transform: scale(0); transition: transform .35s cubic-bezier(.34,1.8,.5,1); box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  .pcard.selected .pcheck { transform: scale(1); }
  .pctrl { display: none; align-items: center; gap: 3px; margin-top: 7px; }
  .pcard.selected .pctrl { display: flex; animation: fadeIn .25s; }
  .pctrl button { width: 28px; height: 30px; border: none; border-radius: 9px; background: var(--g100); color: var(--g800); font-size: 18px; font-weight: 800; cursor: pointer; flex: none; }
  .pctrl button:active { transform: scale(.88); }
  .pctrl input { width: 100%; min-width: 0; text-align: center; border: 1.5px solid var(--line); border-radius: 9px; padding: 5px 2px; font-size: 14px; font-weight: 700; background: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  .ls-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 60%, rgba(241,246,242,0)); z-index: 4; }
  .go-btn { width: 100%; border: none; border-radius: 18px; padding: 16px; font-size: 17px; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--g700), var(--g600)); box-shadow: 0 12px 28px rgba(27,107,58,.4); transition: transform .2s var(--ease), opacity .2s; }
  .go-btn:active { transform: scale(.97); } .go-btn:disabled { opacity: .45; box-shadow: none; }
  .go-btn.amber { background: linear-gradient(135deg, var(--amber), var(--amber2)); color: #2a1c00; box-shadow: 0 12px 28px rgba(255,143,0,.35); }
  .go-btn.ghost2 { background: #fff; color: var(--g800); box-shadow: var(--shadow-s); border: 1.5px solid var(--line); }

  /* felugró ablak (email) */
  #modal { position: fixed; inset: 0; z-index: 70; background: rgba(8,24,15,.55); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; }
  #modal.open { display: flex; animation: fadeIn .25s; }
  .modal-card { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 20px 16px 22px; animation: sheetUp .45s var(--ease); }
  @keyframes sheetUp { from { transform: translateY(100%) } to { transform: none } }
  .modal-card h3 { margin: 0 0 4px; color: var(--g800); font-size: 19px; } .modal-card p.sub { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  .modal-card textarea { width: 100%; min-height: 130px; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; font: inherit; font-size: 15px; resize: vertical; background: #fbfdfb; }
  .modal-card textarea:focus { outline: none; border-color: var(--g600); box-shadow: 0 0 0 3px rgba(46,139,79,.18); }
  .mrow { display: flex; gap: 8px; margin-top: 12px; } .mrow > * { flex: 1; }
  .erow { background: var(--g50); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; margin-top: 10px; animation: cardIn .35s var(--ease) both; }
  .erow.warn { background: #fff7e0; border-color: #ffd770; }
  .eraw { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; } .eraw b { color: var(--ink); }
  .efields { display: flex; gap: 6px; align-items: center; }
  .efields select, .efields input { padding: 9px 8px; border-radius: 10px; border: 1.5px solid var(--line); font-size: 14px; background: #fff; min-width: 0; }
  .efields .esel { flex: 1; } .efields .eqty { width: 68px; } .efields .eunit { width: 84px; }
  .efields .edel { border: none; background: #fde8e8; color: #c62828; border-radius: 10px; width: 36px; height: 38px; font-weight: 800; cursor: pointer; }

  /* bevásárlás: lebegő gomb + checklist */
  #shopFab { position: absolute; left: 14px; bottom: 18px; z-index: 30; border: none; border-radius: 999px; padding: 15px 20px; font-size: 16px; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--amber2), var(--amber)); color: #2a1c00; box-shadow: 0 10px 28px rgba(255,143,0,.45); animation: fabPulse 2.6s ease-in-out infinite; transition: transform .2s var(--ease); display: none; }
  #shopFab.show { display: block; } #shopFab:active { transform: scale(.93); }
  @keyframes fabPulse { 0%,100% { box-shadow: 0 10px 28px rgba(255,143,0,.45), 0 0 0 0 rgba(255,179,0,.5) } 50% { box-shadow: 0 10px 28px rgba(255,143,0,.45), 0 0 0 12px rgba(255,179,0,0) } }
  .prog { height: 9px; background: #e4ece6; border-radius: 99px; overflow: hidden; margin: 6px 0 12px; }
  .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--g600), #7bd389); border-radius: 99px; transition: width .6s var(--ease); }
  .crow { display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 16px; margin-bottom: 7px; background: #fff; border: 1.5px solid var(--line); cursor: pointer; transition: transform .2s var(--ease), background .3s; animation: cardIn .35s var(--ease) both; }
  .crow:active { transform: scale(.98); } .crow.done { background: var(--g50); border-color: #bfe0c9; }
  .cthumb { position: relative; width: 52px; height: 52px; border-radius: 13px; overflow: hidden; background: linear-gradient(135deg, #eef5f0, #dfeee4); display: grid; place-items: center; flex: none; font-size: 26px; }
  .cthumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s; } .cthumb img.loaded { opacity: 1; }
  .cmain { flex: 1; min-width: 0; } .cmain b { display: block; font-size: 15.5px; } .cmain small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .cmain .cdone { color: var(--g700); font-weight: 600; }
  .ccheck { width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid #c9d6cc; display: grid; place-items: center; color: transparent; font-weight: 900; flex: none; transition: all .35s cubic-bezier(.34,1.8,.5,1); }
  .crow.done .ccheck { background: var(--g600); border-color: var(--g600); color: #fff; transform: scale(1.08); }
  .vgroup { margin-top: 14px; } .vgroup h4 { margin: 0 0 6px; font-size: 15px; color: var(--g800); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .vgroup h4 .tag { font-size: 12px; font-weight: 700; background: #fff3cd; color: #8a5a00; padding: 3px 9px; border-radius: 99px; }
  .sumtable { width: 100%; border-collapse: collapse; font-size: 13.5px; } .sumtable td, .sumtable th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; } .sumtable td:last-child, .sumtable th:last-child { text-align: right; }
  .stat-row { display: flex; gap: 8px; margin: 10px 0; } .stat { flex: 1; background: var(--g50); border: 1.5px solid #cfe5d5; border-radius: 16px; padding: 12px; text-align: center; animation: cardIn .45s var(--ease) both; }
  .stat b { display: block; font-size: 22px; color: var(--g800); } .stat small { color: var(--muted); font-size: 12px; }
  .stat.warn { background: #fff7e0; border-color: #ffd770; } .stat.warn b { color: #8a5a00; }
  .vopt { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .vopt input { width: 20px; height: 20px; accent-color: var(--g600); flex: none; }
  .vopt small { color: var(--muted); }
  .flabel { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .5px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

</style>
</head>
<body data-screen="home">
<!-- ====== v2.0 KEZDŐKÉPERNYŐ ====== -->
<div id="homeScreen" class="screen">
  <div class="home-emojis" aria-hidden="true">
    <span style="left:6%;top:9%;animation-delay:0s">🥕</span><span style="left:78%;top:6%;animation-delay:1.2s">🍅</span>
    <span style="left:40%;top:3%;animation-delay:2.1s">🥬</span><span style="left:88%;top:38%;animation-delay:.6s">🧅</span>
    <span style="left:4%;top:44%;animation-delay:3s">🍎</span><span style="left:70%;top:82%;animation-delay:1.8s">🥒</span>
    <span style="left:14%;top:84%;animation-delay:2.6s">🍄</span><span style="left:50%;top:90%;animation-delay:.9s">🫑</span>
  </div>
  <div class="home-inner">
    <div class="home-brand">Nagybani Gastro</div>
    <div class="home-title">Mit csinálunk<br><em>ma?</em></div>
    <button class="resume-card" id="resumeCard"><span style="font-size:30px">⏱️</span><span><b id="resumeTitle">Folyamatban lévő bevásárlás</b><small id="resumeSub"></small></span><span class="rc-arrow">›</span></button>
    <button class="big-card" id="goShop"><span class="bc-ico">🛒</span><span><b>Bevásárlás</b><small>Lista összeállítása, piac, térkép, checklist</small></span></button>
    <button class="big-card disabled" id="goDeliver"><span class="bc-ico">🚚</span><span><b>Kiszállítás</b><small>Komissiózás, szállítás — hamarosan</small></span></button>

<script>
/* ====== BEÁLLÍTÁSOK ====== */
const firebaseConfig = {
  apiKey: "IDE_A_FIREBASE_API_KEY",
  authDomain: "IDE_A_PROJEKT.firebaseapp.com",
  databaseURL: "https://IDE_A_PROJEKT-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "IDE_A_PROJEKT",
  storageBucket: "IDE_A_PROJEKT.appspot.com",
  messagingSenderId: "IDE_A_SENDER_ID",
  appId: "IDE_AZ_APP_ID"
};

const MARKET_CENTER = { lat: 47.414838, lng: 19.168016 }; // Budapesti Nagybani Piac, Nagykőrösi út
const MARKET_ZOOM = 19;
const MARKET_MIN_ZOOM = 17;
const MARKET_MAX_ZOOM = 21;
const MARKET_RADIUS_DEG = 0.006;

const LONG_PRESS_MS = 550;
const NEARBY_VENDOR_LIMIT = 8;
const CLEANUP_CHECK_INTERVAL_MS = 5 * 60 * 1000; // 5 percenként ellenőrzi, elmúlt-e éjfél

/* ====== ÁLLAPOT ====== */
let map;
let selectedStandId = null;
let vendors = {};
let markers = {};
let purchasesCache = {};
let db = null;
let firebaseReady = false;
let knownItems = new Set(); // korábban rögzített termék nevek (elgépelés-ellenőrzéshez)

function showStatus(msg, ms = 2500) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => { el.style.display = 'none'; }, ms);
}

let lastSaved = null; // { type: 'arazas'|'vasarlas', firebaseKey } vagy { type, localIndex }

function showUndoToast(msg) {
  const el = document.getElementById('status');
  el.innerHTML = escapeHtml(msg) + ' <button id="undoBtn" style="margin-left:10px;background:#ffb300;color:#222;border:none;border-radius:4px;padding:4px 10px;font-weight:bold;">Visszavonás</button>';
  el.style.display = 'block';
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => { el.style.display = 'none'; }, 6000);
  document.getElementById('undoBtn').addEventListener('click', undoLastSave);
}

function undoLastSave() {
  if (!lastSaved) return;
  const node = lastSaved.type === 'arazas' ? 'priceEntries' : 'purchases';
  if (lastSaved.firebaseKey) {
    db.ref(node + '/' + lastSaved.firebaseKey).remove();
  } else if (lastSaved.localIndex != null) {
    const key = lastSaved.type === 'arazas' ? 'piaci_entries' : 'piaci_purchases';
    const arr = JSON.parse(localStorage.getItem(key) || '[]');
    arr.splice(lastSaved.localIndex, 1);
    localStorage.setItem(key, JSON.stringify(arr));
    if (lastSaved.type === 'vasarlas') renderMarkers();
  }
  showStatus('Visszavonva.');
  lastSaved = null;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

/* ====== ELGÉPELÉS-ELLENŐRZÉS (korábban használt termékneveinkhez viszonyítva) ====== */
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
    }
  }
  return dp[m][n];
}

function refreshKnownItems() {
  Promise.all([loadAllEntries(), loadAllPurchases()]).then(([entries, purchases]) => {
    const set = new Set();
    entries.forEach(e => { if (e.item) set.add(e.item.trim().toLowerCase()); });
    purchases.forEach(e => { if (e.item) set.add(e.item.trim().toLowerCase()); });
    knownItems = set;
  });
}

function findSpellingSuggestion(item) {
  const norm = item.trim().toLowerCase();
  if (knownItems.has(norm) || knownItems.size === 0) return null;
  let best = null, bestDist = Infinity;
  knownItems.forEach(k => {
    const d = levenshtein(norm, k);
    if (d < bestDist) { bestDist = d; best = k; }
  });
  const threshold = norm.length <= 4 ? 1 : 2;
  if (best && bestDist > 0 && bestDist <= threshold) return best;
  return null;
}

/* ====== FIREBASE INIT ====== */
function initFirebase() {
  try {
    if (firebaseConfig.apiKey === "IDE_A_FIREBASE_API_KEY") {
      showStatus("⚠️ Firebase nincs beállítva - csak helyi (offline) mód aktív", 5000);
      return;
    }
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    firebaseReady = true;
    listenVendors();
    listenPurchases();
  } catch (e) {
    console.error("Firebase init hiba:", e);
    showStatus("Firebase hiba - offline módban futunk", 4000);
  }
}

function listenVendors() {
  if (!db) return;
  db.ref('vendors').on('value', snap => {
    vendors = snap.val() || {};
    renderMarkers();
  });
}

function listenPurchases() {
  if (!db) return;
  db.ref('purchases').on('value', snap => {
    purchasesCache = snap.val() || {};
    renderMarkers();
  });
}

/* ====== TÉRKÉP ====== */
function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: MARKET_CENTER,
    zoom: MARKET_ZOOM,
    minZoom: MARKET_MIN_ZOOM,
    maxZoom: MARKET_MAX_ZOOM,
    mapTypeId: 'satellite',
    tilt: 0,
    streetViewControl: false,
    mapTypeControl: true,
    fullscreenControl: false,
    restriction: {
      latLngBounds: {
        north: MARKET_CENTER.lat + MARKET_RADIUS_DEG,
        south: MARKET_CENTER.lat - MARKET_RADIUS_DEG,
        east: MARKET_CENTER.lng + MARKET_RADIUS_DEG,
        west: MARKET_CENTER.lng - MARKET_RADIUS_DEG,
      },
      strictBounds: true,
    },
  });

  initFirebase();
  listenSession();

  if (!firebaseReady) {
    loadLocalVendors();
    renderMarkers();
  }

  startLocationTracking();
  setupLongPress();
  refreshKnownItems();
  cleanupTemporaryVendors();
  setInterval(cleanupTemporaryVendors, CLEANUP_CHECK_INTERVAL_MS);
}

/* ====== HOSSZAN NYOMÁS A TÉRKÉPEN - ÚJ STAND BÁRHOL ====== */
function setupLongPress() {
  let pressTimer = null;
  let pressLatLng = null;

  const cancelPress = () => {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    pressLatLng = null;
  };

  map.addListener('mousedown', (e) => {
    pressLatLng = e.latLng;
    pressTimer = setTimeout(() => {
      if (pressLatLng) {
        handleNewPosition(pressLatLng.lat(), pressLatLng.lng());
      }
      pressTimer = null;
    }, LONG_PRESS_MS);
  });
  map.addListener('mouseup', cancelPress);
  map.addListener('dragstart', cancelPress);
  map.addListener('zoom_changed', cancelPress);
}

/* ====== KÉK PONT - SAJÁT POZÍCIÓ ====== */
let myLocationMarker = null;
let myAccuracyCircle = null;

function startLocationTracking() {
  if (!navigator.geolocation) {
    showStatus("A böngésződ nem támogatja a GPS-t");
    return;
  }
  navigator.geolocation.watchPosition(
    pos => updateMyLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
    err => showStatus("GPS hiba: " + err.message, 4000),
    { enableHighAccuracy: true, maximumAge: 5000 }
  );
}

function updateMyLocation(lat, lng, accuracy) {
  const pos = { lat, lng };

  if (!myLocationMarker) {
    myLocationMarker = new google.maps.Marker({
      position: pos,
      map: map,
      title: "Itt állsz - kattints ide új stand felvételéhez",
      zIndex: 999,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 8,
        fillColor: '#1a73e8',
        fillOpacity: 1,
        strokeColor: 'white',
        strokeWeight: 3,
      }
    });
    myLocationMarker.addListener('click', () => {
      handleNewPosition(myLocationMarker.getPosition().lat(), myLocationMarker.getPosition().lng());
    });

    myAccuracyCircle = new google.maps.Circle({
      map: map,
      center: pos,
      radius: accuracy || 10,
      fillColor: '#1a73e8',
      fillOpacity: 0.15,
      strokeColor: '#1a73e8',
      strokeOpacity: 0.4,
      strokeWeight: 1,
      clickable: false,
    });
  } else {
    myLocationMarker.setPosition(pos);
    myAccuracyCircle.setCenter(pos);
    myAccuracyCircle.setRadius(accuracy || 10);
  }
}

function loadLocalVendors() {
  try {
    vendors = JSON.parse(localStorage.getItem('piaci_vendors') || '{}');
  } catch (e) { vendors = {}; }
}
function saveLocalVendors() {
  localStorage.setItem('piaci_vendors', JSON.stringify(vendors));
}

/* ====== MARKEREK (kis feliratos pin + kiemelés, ha ma itt vásároltunk) ====== */
function buildVendorIcon(name, color, selected, favorite, temporary) {
  const prefix = (favorite ? '⭐' : '') + (temporary ? '⏳' : '');
  const label = escapeHtml((prefix ? prefix + ' ' : '') + (name || 'Stand').slice(0, 22));
  const r = selected ? 10 : 8;
  const cx = 14, cy = 14;
  const textX = cx + r + 5;
  const width = Math.max(50, textX + label.length * 6.6 + 8);
  const height = 28;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '">' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + color + '" stroke="white" stroke-width="2.5"/>' +
    '<text x="' + textX + '" y="' + (cy + 4) + '" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="black" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">' + label + '</text>' +
    '<text x="' + textX + '" y="' + (cy + 4) + '" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111">' + label + '</text>' +
    '</svg>';
  return {
    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
    scaledSize: new google.maps.Size(width, height),
    anchor: new google.maps.Point(cx, cy),
  };
}

function getPurchasedTodaySet() {
  const today = todayStr();
  const set = new Set();
  const source = firebaseReady
    ? Object.values(purchasesCache)
    : JSON.parse(localStorage.getItem('piaci_purchases') || '[]');
  source.forEach(p => { if (p.date === today) set.add(p.vendorId); });
  return set;
}

function renderMarkers() {
  Object.values(markers).forEach(m => m.setMap(null));
  markers = {};

  const purchasedToday = getPurchasedTodaySet();

  Object.entries(vendors).forEach(([id, v]) => {
    const isSelected = id === selectedStandId;
    const boughtHere = purchasedToday.has(id);
    let color = '#1b5e20';
    if (boughtHere) color = '#d81b60';
    if (isSelected) color = '#ffb300';

    const isTemporary = v.permanent === false;
    const titlePrefix = (v.favorite ? '⭐ ' : '') + (isTemporary ? '⏳ ' : '');
    const marker = new google.maps.Marker({
      position: { lat: v.lat, lng: v.lng },
      map: map,
      title: titlePrefix + (v.name || 'Stand') + (isTemporary ? ' (ideiglenes, ma törlődik)' : ''),
      icon: buildVendorIcon(v.name, color, isSelected, v.favorite, isTemporary),
      zIndex: isSelected ? 500 : (boughtHere ? 300 : (v.favorite ? 200 : 100)),
    });
    marker.addListener('click', () => openVendorPanel(id));
    markers[id] = marker;
  });
}

/* ====== ÚJ POZÍCIÓ KEZELÉSE ====== */
function handleNewPosition(lat, lng) {
  const nearId = findNearbyVendor(lat, lng, 15);
  if (nearId) {
    selectedStandId = nearId;
    showStatus('Kiválasztva: ' + (vendors[nearId].name || 'meglévő stand') + ' (frissítheted az árait)');
    renderMarkers();
    return;
  }

  const name = prompt("Új stand neve / kereskedő neve:", "");
  if (name === null) return;
  createVendor(name || "Névtelen stand", lat, lng);
}

function findNearbyVendor(lat, lng, meters) {
  for (const [id, v] of Object.entries(vendors)) {
    if (distanceMeters(lat, lng, v.lat, v.lng) <= meters) return id;
  }
  return null;
}
function distanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function getNearbyVendorsSorted(lat, lng, limit) {
  return Object.entries(vendors)
    .map(([id, v]) => ({ id, name: v.name, dist: distanceMeters(lat, lng, v.lat, v.lng) }))
    .sort((a, b) => a.dist - b.dist)
    .slice(0, limit);
}

function createVendor(name, lat, lng) {
  const id = 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  // alapból ideiglenes: ha nem jelölöd fixnek, éjfélkor automatikusan törlődik
  const vendor = { name, lat, lng, permanent: false, createdDate: todayStr() };
  vendors[id] = vendor;
  selectedStandId = id;

  if (firebaseReady) {
    db.ref('vendors/' + id).set(vendor);
  } else {
    saveLocalVendors();
    renderMarkers();
  }
  showStatus('Új stand létrehozva: ' + name + ' (ideiglenes — éjfélkor törlődik, ha nem jelölöd fixnek)');
  return id;
}

/* ====== IDEIGLENES STANDOK AUTOMATIKUS TÖRLÉSE ÉJFÉLKOR ======
   Csak azok a standok törlődnek, amik explicit permanent:false értékkel
   lettek létrehozva (vagyis az ÚJ verzió óta felvettek), és nem a mai napon
   jöttek létre. A régebbi (permanent mezőt nem tartalmazó) standok
   biztonságból érintetlenek maradnak, amíg valaki explicit nem dönt róluk. */
function cleanupTemporaryVendors() {
  const today = todayStr();
  let changedLocally = false;
  Object.entries(vendors).forEach(([id, v]) => {
    if (v.permanent === false && v.createdDate && v.createdDate !== today) {
      if (firebaseReady) {
        db.ref('vendors/' + id).remove();
      } else {
        delete vendors[id];
        changedLocally = true;
      }
    }
  });
  if (!firebaseReady && changedLocally) {
    saveLocalVendors();
    renderMarkers();
  }
}

/* ====== GPS GOMB ====== */
document.getElementById('gpsBtn').addEventListener('click', () => {
  if (myLocationMarker) {
    map.setCenter(myLocationMarker.getPosition());
    map.setZoom(MARKET_ZOOM);
    showStatus("A kék pontra kattintva, vagy a térképen hosszan nyomva vehetsz fel új standot.");
  } else {
    showStatus("Helymeghatározás folyamatban...", 4000);
  }
});

/* ====== GYORS BEVITEL: ÁRAZÁS / VÁSÁRLÁS (megerősítő képernyővel) ====== */
document.getElementById('saveBtn').addEventListener('click', () => openLogConfirm('arazas'));
document.getElementById('buyBtn').addEventListener('click', () => openLogConfirm('vasarlas'));
document.getElementById('quickEntry').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') openLogConfirm('arazas');
});

function analyzeQuickEntry(raw) {
  const text = raw.trim();
  if (!text) return { error: 'empty' };

  // az utolsó számot vesszük árnak, ami előtte van az a termék neve
  const priceMatch = text.match(/(\d+([.,]\d+)?)\s*(ft|huf)?\s*$/i);
  if (!priceMatch) {
    return { error: 'noPrice', item: text };
  }
  const price = parseFloat(priceMatch[1].replace(',', '.'));
  const item = text.slice(0, priceMatch.index).trim();
  if (!item) return { error: 'noItem' };
  if (isNaN(price)) return { error: 'noPrice', item };
  return { item, price };
}

function openLogConfirm(type) {
  const raw = document.getElementById('quickEntry').value;
  const parsed = analyzeQuickEntry(raw);

  if (parsed.error === 'empty') {
    showStatus('Írj be egy terméket és árat, pl. "uborka 400"');
    return;
  }
  if (parsed.error === 'noPrice') {
    showStatus('⚠️ Hiányzik az ár! Add meg így: "' + parsed.item + ' 400"');
    return;
  }
  if (parsed.error === 'noItem') {
    showStatus('⚠️ Hiányzik a termék neve!');
    return;
  }

  if (!myLocationMarker) {
    showStatus("Várj, amíg az app megtalálja a pozíciódat...");
    return;
  }
  const pos = myLocationMarker.getPosition();
  const nearby = getNearbyVendorsSorted(pos.lat(), pos.lng(), NEARBY_VENDOR_LIMIT);
  if (!nearby.length) {
    showStatus("Nincs felvett stand a közelben - vegyél fel egyet a kék pontra kattintva, vagy nyomd hosszan a térképet.");
    return;
  }
  const suggestion = findSpellingSuggestion(parsed.item);
  showConfirmScreen(type, parsed, nearby, suggestion);
}

function unitLabel(u) {
  return { kg: 'kg', db: 'db', rekesz: 'rekesz', lada: 'láda' }[u] || (u || 'kg');
}

function showConfirmScreen(type, parsed, nearby, suggestion) {
  const isPurchase = type === 'vasarlas';
  const content = document.getElementById('panelContent');

  const radios = nearby.map((v, i) =>
    '<label style="display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid #eee;">' +
    '<input type="radio" name="confirmVendor" value="' + v.id + '" ' + (i === 0 ? 'checked' : '') + '>' +
    '<span>' + escapeHtml(v.name || 'Stand') + ' <small style="color:#888">(~' + Math.round(v.dist) + ' m)</small></span>' +
    '</label>'
  ).join('');

  const suggestionHtml = suggestion ? (
    '<div style="background:#fff3cd;border:1px solid #ffe08a;border-radius:6px;padding:10px;margin-bottom:12px;">' +
    '<div style="margin-bottom:8px;">🤔 Erre gondoltál: <strong>' + escapeHtml(suggestion) + '</strong> (te ezt írtad: "' + escapeHtml(parsed.item) + '")?</div>' +
    '<div style="display:flex;gap:8px;">' +
    '<button id="suggYesBtn" style="flex:1;background:#1b5e20;color:white;border:none;border-radius:6px;padding:8px;">Igen, javítsd</button>' +
    '<button id="suggNoBtn" style="flex:1;background:white;color:#333;border:1px solid #ccc;border-radius:6px;padding:8px;">Nem, marad</button>' +
    '</div></div>'
  ) : '';

  const unitSelectHtml =
    '<div class="row"><select id="confirmUnit" style="flex:1;">' +
    '<option value="kg">Ft / kg</option>' +
    '<option value="db">Ft / db</option>' +
    '<option value="rekesz">Ft / rekesz</option>' +
    '<option value="lada">Ft / láda</option>' +
    '</select></div>';

  const crateHtml = isPurchase
    ? '<p style="margin:14px 0 4px;font-weight:bold;">Kell csere edényzet vinni?</p>' +
      '<div class="row">' +
      '<select id="confirmCrateType" style="flex:1;">' +
      '<option value="">Nincs</option>' +
      '<option value="rekesz">Rekesz</option>' +
      '<option value="lada">Láda</option>' +
      '</select>' +
      '<input type="number" id="confirmCrateQty" placeholder="mennyi db" min="0" step="1" style="width:110px;">' +
      '</div>'
    : '';

  content.innerHTML =
    '<h3>' + (isPurchase ? '🛒 Vásárlás megerősítése' : '📝 Árazás megerősítése') + '</h3>' +
    suggestionHtml +
    '<p style="font-size:17px;"><strong>' + escapeHtml(parsed.item) + '</strong> — ' + parsed.price + ' Ft</p>' +
    unitSelectHtml +
    (isPurchase ? '<div class="row"><input type="number" id="confirmQty" placeholder="mennyiség - opcionális" min="0" step="0.1" style="width:100%;"></div>' : '') +
    crateHtml +

      const qtyRaw = document.getElementById('confirmQty').value;
      const qty = qtyRaw ? parseFloat(qtyRaw) : null;
      const crateType = document.getElementById('confirmCrateType').value || null;
      const crateQtyRaw = document.getElementById('confirmCrateQty').value;
      const crateQty = crateType && crateQtyRaw ? parseFloat(crateQtyRaw) : null;
      savePurchase(vendorId, parsed.item, parsed.price, qty, unit, crateType, crateQty, todayStr());
    } else {

function saveArazas(vendorId, item, price, unit, date) {
  const entry = {
    vendorId,
    vendorName: (vendors[vendorId] && vendors[vendorId].name) || '',
    item, price, unit: unit || 'kg', date,
    timestamp: Date.now(),
  };
  if (firebaseReady) {
    const ref = db.ref('priceEntries').push(entry);
    lastSaved = { type: 'arazas', firebaseKey: ref.key };
  } else {
    const entries = JSON.parse(localStorage.getItem('piaci_entries') || '[]');
    entries.push(entry);
    localStorage.setItem('piaci_entries', JSON.stringify(entries));
    lastSaved = { type: 'arazas', localIndex: entries.length - 1 };
  }
  knownItems.add(item.trim().toLowerCase());
  showUndoToast('Árazás mentve: ' + item + ' — ' + price + ' Ft/' + unitLabel(entry.unit) + ' (' + entry.vendorName + ')');
}

function savePurchase(vendorId, item, price, quantity, unit, crateType, crateQty, date, silent) {
  const entry = {
    vendorId,
    vendorName: (vendors[vendorId] && vendors[vendorId].name) || '',
    item, price,
    unit: unit || 'kg',
    quantity: (quantity === null || quantity === undefined || isNaN(quantity)) ? null : quantity,
    crateType: crateType || null,
    crateQty: (crateType && crateQty && !isNaN(crateQty)) ? crateQty : null,
    date,
    collected: false,
    timestamp: Date.now(),
  };
  let purchaseId;
  if (firebaseReady) {
    const ref = db.ref('purchases').push(entry);
    if (!silent) lastSaved = { type: 'vasarlas', firebaseKey: ref.key };
    purchaseId = ref.key;
  } else {
    const purchases = JSON.parse(localStorage.getItem('piaci_purchases') || '[]');
    purchases.push(entry);
    localStorage.setItem('piaci_purchases', JSON.stringify(purchases));
    if (!silent) lastSaved = { type: 'vasarlas', localIndex: purchases.length - 1 };
    purchaseId = 'local_' + (purchases.length - 1);
    renderMarkers();
  }
  knownItems.add(item.trim().toLowerCase());
  const crateNote = entry.crateType ? (' + ' + entry.crateQty + ' ' + unitLabel(entry.crateType) + ' csere') : '';
  if (!silent) showUndoToast('Vásárlás mentve: ' + item + ' — ' + price + ' Ft/' + unitLabel(entry.unit) + crateNote + ' (' + entry.vendorName + ')');
  return purchaseId;
}

      (isPermanent ? '📌 Fix hely — kattints, hogy ideiglenes legyen' : '⏳ Ideiglenes — kattints a fixálásához') + '</button>' +
      '<textarea id="noteInput" placeholder="Jegyzet (pl. minőség, telefonszám, mikor van itt...)" style="width:100%;min-height:70px;padding:10px;border-radius:6px;border:1px solid #ccc;font-size:14px;font-family:inherit;">' + escapeHtml(v.note || '') + '</textarea>' +

function loadVendorEntries(vendorId) {
  if (firebaseReady) {
    return db.ref('priceEntries').orderByChild('vendorId').equalTo(vendorId).once('value')
      .then(snap => Object.values(snap.val() || {}));
  } else {
    const entries = JSON.parse(localStorage.getItem('piaci_entries') || '[]');
    return Promise.resolve(entries.filter(e => e.vendorId === vendorId));
  }
}

/* ====== ADATOK BETÖLTÉSE ====== */
function loadAllEntries() {
  if (firebaseReady) {
    return db.ref('priceEntries').once('value').then(snap => Object.values(snap.val() || {}));
  } else {
    return Promise.resolve(JSON.parse(localStorage.getItem('piaci_entries') || '[]'));
  }
}
function loadAllPurchases() {
  if (firebaseReady) {
    return db.ref('purchases').once('value').then(snap => {
      const out = [];
      snap.forEach(child => { out.push(Object.assign({ id: child.key }, child.val())); });
      return out;
    });
  } else {
    const arr = JSON.parse(localStorage.getItem('piaci_purchases') || '[]');
    return Promise.resolve(arr.map((e, i) => Object.assign({ id: 'local_' + i }, e)));
  }
}

function toggleCollected(purchaseId, collected) {
  if (firebaseReady) {
    db.ref('purchases/' + purchaseId + '/collected').set(collected);
  } else {
    const idx = parseInt(purchaseId.replace('local_', ''), 10);
    const arr = JSON.parse(localStorage.getItem('piaci_purchases') || '[]');
    if (arr[idx]) {
      arr[idx].collected = collected;
      localStorage.setItem('piaci_purchases', JSON.stringify(arr));
    }
  }
}

function renderMainListTab(tab) {
  const content = document.getElementById('panelContent');
  const tabBtn = (id, label) =>
    '<button data-tab="' + id + '" style="flex:1;padding:10px 4px;border:none;border-bottom:3px solid ' + (tab === id ? '#1b5e20' : 'transparent') + ';background:' + (tab === id ? '#e8f5e9' : '#f5f5f5') + ';font-weight:' + (tab === id ? 'bold' : 'normal') + ';font-size:13px;cursor:pointer;">' + label + '</button>';

  content.innerHTML =
    '<div style="display:flex;margin-bottom:12px;border-radius:6px;overflow:hidden;flex-wrap:wrap;">' +
    tabBtn('arazas', '📝 Árazások') + tabBtn('vasarlas', '🛒 Vásárlások') + tabBtn('pickup', '🧺 Elviendő') + tabBtn('cheapest', '💰 Legolcsóbb ma') +
    '</div><div id="tabContent"><p>Betöltés...</p></div>';

  content.querySelectorAll('button[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => renderMainListTab(btn.dataset.tab));
  });
  const tabContent = document.getElementById('tabContent');

  if (tab === 'arazas') {
    loadAllEntries().then(entries => {
      entries.sort((a, b) => b.timestamp - a.timestamp);
      renderEntryTable(tabContent, entries, false);
    });
  } else if (tab === 'vasarlas') {
    loadAllPurchases().then(purchases => {
      purchases.sort((a, b) => b.timestamp - a.timestamp);
      renderEntryTable(tabContent, purchases, true);
    });
  } else if (tab === 'pickup') {
    loadAllPurchases().then(purchases => renderPickupList(tabContent, purchases));
  } else if (tab === 'cheapest') {
    loadAllEntries().then(entries => renderCheapestToday(tabContent, entries));
  }
}

function purchaseCost(e) {
  return (e.quantity != null && !isNaN(e.quantity)) ? e.price * e.quantity : e.price;
}

function renderEntryTable(container, list, isPurchase) {
  const rowHtml = e => '<tr><td>' + e.date + '</td><td>' + escapeHtml(e.vendorName || '?') + '</td><td>' + escapeHtml(e.item) + '</td>' + (isPurchase ? ('<td>' + (e.quantity != null ? e.quantity : '-') + '</td>') : '') + '<td>' + e.price + ' Ft/' + unitLabel(e.unit) + '</td>' + (isPurchase && e.crateType ? ('<td>' + e.crateQty + ' ' + unitLabel(e.crateType) + '</td>') : (isPurchase ? '<td>-</td>' : '')) + '</tr>';
  const headerHtml = '<tr><th>Dátum</th><th>Stand</th><th>Termék</th>' + (isPurchase ? '<th>Menny.</th>' : '') + '<th>Ár</th>' + (isPurchase ? '<th>Csere</th>' : '') + '</tr>';
  let rows = list.map(rowHtml).join('');
  if (!rows) rows = '<tr><td colspan="' + (isPurchase ? 6 : 4) + '">Még nincs adat.</td></tr>';

  let summaryHtml = '';
  if (isPurchase) {
    const today = todayStr();
    const todays = list.filter(e => e.date === today);
    const total = todays.reduce((sum, e) => sum + purchaseCost(e), 0);
    summaryHtml = '<div style="background:#e8f5e9;border-radius:6px;padding:10px;margin-bottom:8px;font-weight:bold;color:#1b5e20;">Mai vásárlások: ' + todays.length + ' tétel, összesen ~' + Math.round(total) + ' Ft</div>';
  }

  container.innerHTML =
    summaryHtml +
    '<input type="text" id="filterInput" placeholder="Szűrés termékre..." style="width:100%;padding:10px;border-radius:6px;border:1px solid #ccc;margin-bottom:8px;">' +
    '<table id="listTable">' + headerHtml + rows + '</table>';

  document.getElementById('filterInput').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = q ? list.filter(en => en.item.toLowerCase().includes(q)) : list;
    document.getElementById('listTable').innerHTML = headerHtml + (filtered.map(rowHtml).join('') || ('<tr><td colspan="' + (isPurchase ? 6 : 4) + '">Nincs találat.</td></tr>'));
  });
}

function renderPickupList(container, purchases) {
  const pending = purchases.filter(e => !e.collected).sort((a, b) => b.timestamp - a.timestamp);
  if (!pending.length) {
    container.innerHTML = '<p>Nincs elviendő tétel - minden fel van pakolva. 🎉</p>';
    return;
  }
  const crateTotals = {};
  pending.forEach(e => {
    if (e.crateType && e.crateQty) {
      crateTotals[e.crateType] = (crateTotals[e.crateType] || 0) + Number(e.crateQty);
    }
  });
  const crateSummary = Object.keys(crateTotals).length
    ? '<div style="background:#fff3cd;border:1px solid #ffe08a;border-radius:6px;padding:10px;margin-bottom:10px;font-weight:bold;color:#8a5a00;">🧺 Vidd magaddal csereként: ' +
      Object.entries(crateTotals).map(([t, q]) => q + ' ' + unitLabel(t)).join(', ') + '</div>'
    : '';

  const rows = pending.map(e =>
    '<label style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #eee;">' +
    '<input type="checkbox" class="pickupCheck" data-id="' + e.id + '" style="width:20px;height:20px;">' +
    '<span style="flex:1;">' +
    '<strong>' + escapeHtml(e.item) + '</strong>' + (e.quantity != null ? ' (' + e.quantity + ' ' + unitLabel(e.unit) + ')' : '') +
    '<br><small style="color:#888;">' + escapeHtml(e.vendorName || '?') + ' — ' + e.price + ' Ft/' + unitLabel(e.unit) + ' — ' + e.date + '</small>' +
    (e.crateType ? '<br><small style="color:#d84315;">+ ' + e.crateQty + ' ' + unitLabel(e.crateType) + ' csere edényzet</small>' : '') +
    '</span></label>'
  ).join('');
  container.innerHTML = crateSummary + '<p style="color:#666;margin-top:0;">Pipáld ki, ha felpakoltad a kiskocsira.</p><div>' + rows + '</div>';

  container.querySelectorAll('.pickupCheck').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const id = e.target.dataset.id;
      toggleCollected(id, e.target.checked);
      if (e.target.checked) {
        e.target.closest('label').style.opacity = '0.4';
        e.target.closest('label').style.textDecoration = 'line-through';
      }
    });
  });
}

function renderCheapestToday(container, entries) {
  const today = todayStr();
  const todays = entries.filter(e => e.date === today);
  if (!todays.length) {
    container.innerHTML = '<p>Ma még nincs rögzített árazás.</p>';
    return;
  }
  const byItem = {};
  todays.forEach(e => {
    const key = e.item.trim().toLowerCase() + '|' + (e.unit || 'kg');
    (byItem[key] = byItem[key] || []).push(e);
  });

  let html = '';
  Object.keys(byItem).sort().forEach(key => {
    const list = byItem[key].sort((a, b) => a.price - b.price);
    html += '<div style="margin-bottom:16px;">' +
      '<div style="font-weight:bold;color:#1b5e20;font-size:15px;">' + escapeHtml(list[0].item) + ' <small style="color:#888;font-weight:normal;">(Ft/' + unitLabel(list[0].unit) + ')</small></div>' +
      '<table><tr><th>Stand</th><th>Ár</th></tr>' +
      list.map((e, i) => '<tr' + (i === 0 ? ' style="background:#e8f5e9;font-weight:bold;"' : '') + '><td>' + escapeHtml(e.vendorName || '?') + '</td><td>' + e.price + ' Ft</td></tr>').join('') +
      '</table></div>';
  });
  container.innerHTML = '<p style="color:#666;font-size:13px;margin-top:0;">' + today + '</p>' + html;
}

function setupVoiceInput() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('micBtn');
  if (!SpeechRecognition) {
    micBtn.style.display = 'none';
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = 'hu-HU';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  micBtn.addEventListener('click', () => {
    showStatus('🎤 Hallgatlak...', 4000);
    try { recognition.start(); } catch (e) { /* már fut, figyelmen kívül hagyjuk */ }
  });
  recognition.addEventListener('result', (e) => {
    const text = e.results[0][0].transcript;
    document.getElementById('quickEntry').value = text;
    showStatus('Felismerve: "' + text + '"', 3000);
  });
  recognition.addEventListener('error', (e) => {
    showStatus('Hangfelismerési hiba: ' + e.error, 3000);
  });
}

function normText(s) {
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
const CAT_BY_KEY = {}; CATALOG_CATS.forEach(c => { CAT_BY_KEY[c.key] = c; });
const PROD_BY_ID = {};
CATALOG.forEach(p => { p.n = normText(p.name); p.s = (p.syn || []).map(normText); PROD_BY_ID[p.id] = p; });

const UNIT_OPTIONS = [['kg', 'kg'], ['db', 'db'], ['csomó', 'csomó'], ['köteg', 'köteg'], ['doboz', 'doboz'], ['vödör', 'vödör'], ['csomag', 'csomag'], ['rekesz', 'rekesz'], ['lada', 'láda']];
function toUnitKey(u) { return u === 'láda' ? 'lada' : u; }

/* ---------- TERMÉKKÉPEK: élő betöltés a Wikipédiáról, eltárolva a készüléken ---------- */
let imgCache = {};
try { imgCache = JSON.parse(localStorage.getItem('piaci_imgs') || '{}'); } catch (e) { imgCache = {}; }
function saveImgCache() { try { localStorage.setItem('piaci_imgs', JSON.stringify(imgCache)); } catch (e) { /* tele a tár */ } }
const imgQueue = []; let imgActive = 0; const imgPending = {};
function pumpImgQueue() {
  while (imgActive < 4 && imgQueue.length) {
    const task = imgQueue.shift(); imgActive++;
    task().finally(() => { imgActive--; pumpImgQueue(); });
  }
}
function fetchWikiThumb(title) {
  const k = 't:' + title;
  if (k in imgCache) return Promise.resolve(imgCache[k]);
  if (imgPending[k]) return imgPending[k];
  imgPending[k] = new Promise(resolve => {
    imgQueue.push(() => fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')))
      .then(r => r.ok ? r.json() : null)
      .then(j => {
        const u = (j && j.type !== 'disambiguation' && j.thumbnail && j.thumbnail.source) || '';
        imgCache[k] = u; saveImgCache(); resolve(u);
      })
      .catch(() => resolve('')));   // hálózati hiba: nem tároljuk el, később újrapróbáljuk
    pumpImgQueue();
  }).finally(() => { delete imgPending[k]; });
  return imgPending[k];
}
function resolveProductImage(p) {
  if (imgCache[p.id]) return Promise.resolve(imgCache[p.id]);
  return p.wiki.reduce((chain, t) => chain.then(u => u || fetchWikiThumb(t)), Promise.resolve(''))
    .then(u => { if (u) { imgCache[p.id] = u; saveImgCache(); } return u; });
}
let imgObserver = null;
function applyImg(img, url) {
  if (!url) return;
  img.onload = () => img.classList.add('loaded');
  img.src = url;
}
function hydrateImages(root) {
  if (!imgObserver) {
    imgObserver = new IntersectionObserver(entries => entries.forEach(e => {
      if (e.isIntersecting) {
        imgObserver.unobserve(e.target);
        const img = e.target;
        resolveProductImage(PROD_BY_ID[img.dataset.pid]).then(u => applyImg(img, u));
      }
    }), { rootMargin: '250px' });
  }
  root.querySelectorAll('img[data-pid]:not([src])').forEach(img => {
    const p = PROD_BY_ID[img.dataset.pid];
    if (p && imgCache[p.id]) applyImg(img, imgCache[p.id]); else imgObserver.observe(img);
  });
}

/* ---------- NAPI SESSION (bevásárlólista + folyamat állapota) ---------- */
let SESSION = null;
function newSession() { return { id: 's_' + Date.now(), date: todayStr(), phase: 'list', items: [], updated: Date.now() }; }
function normalizeSession(s) {
  s.items = (s.items || []).map(it => Object.assign({ done: false, buy: null, collected: false }, it));
  return s;
}
function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem('piaci_session') || 'null');
    if (s && s.date === todayStr()) return normalizeSession(s);
  } catch (e) { /* hibás adat */ }
  return newSession();
}
SESSION = loadSession();
function saveSession() {
  SESSION.updated = Date.now();
  const clean = JSON.parse(JSON.stringify(SESSION));

const UNIT_ALIASES = { kg: 'kg', kilo: 'kg', kilogramm: 'kg', kgs: 'kg', db: 'db', darab: 'db', csomo: 'csomó', csom: 'csomag', csomag: 'csomag', koteg: 'köteg', ktg: 'köteg',
  doboz: 'doboz', dob: 'doboz', vodor: 'vödör', vod: 'vödör', rekesz: 'rekesz', lada: 'láda', g: 'g', gramm: 'g', dkg: 'dkg', deka: 'dkg' };
function levenshtein2(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1] : 1 + Math.min(prev[j - 1], prev[j], cur[j - 1]);
    prev = cur;
  }
  return prev[n];
}
function matchProduct(phrase) {
  const nq = normText(phrase); if (!nq) return null;
  let best = null;
  CATALOG.forEach((p, idx) => {
    [p.n].concat(p.s).forEach((k, ki) => {
      if (!k) return; let sc = 0;
      if (k === nq) sc = 100 - (ki ? 0 : -2);
      else if (k.length >= 3 && nq.startsWith(k) && nq.length - k.length <= 3) sc = 90;
      else if (k.includes(nq) && nq.length >= 3) sc = 70 - Math.min(20, k.length - nq.length);
      else if (nq.length >= 4 && nq.includes(k) && k.length >= 4) sc = 60;
      else { const d = levenshtein2(nq, k), lim = k.length > 6 ? 2 : 1; if (d <= lim && nq.length >= 4) sc = 50 - d * 5; }
      if (sc > 0 && (!best || sc > best.score || (sc === best.score && idx < best.idx))) best = { p, score: sc, idx };
    });
  });
  return best && best.score >= 45 ? best : null;
}
function parseOrderText(text) {
  const t = String(text || '').replace(/(\d),(\d)/g, '$1.$2').replace(/[–—]/g, '-');
  const segs = t.split(/[\n;,]|\s+és\s+|\s\+\s/i).map(s => s.replace(/^[\s\-•*·]+/, '').replace(/[.:]+\s*$/, '').trim()).filter(Boolean);
  const out = [];
  segs.forEach(seg => {
    let qty = null, unit = null, phrase = null, m;
    if ((m = seg.match(/^(\d+(?:\.\d+)?)\s*(.*)$/))) {            // "5kg fejeskáposzta", "10 kilo répa", "3 saláta"
      qty = parseFloat(m[1]); let rest = m[2].trim();
      const tok = rest.split(/\s+/)[0], key = normText(tok);
      if (UNIT_ALIASES[key]) { unit = UNIT_ALIASES[key]; rest = rest.slice(tok.length).trim(); }
      rest = rest.replace(/^(?:os|ös|nyi|nyit)\s+/i, '').replace(/^(?:of)\s+/i, ''); phrase = rest;
    } else if ((m = seg.match(/^(.*?)\s+(\d+(?:\.\d+)?)\s*([^\d\s]+)?$/))) {   // "fejeskáposzta 5 kg"
      phrase = m[1]; qty = parseFloat(m[2]); if (m[3] && UNIT_ALIASES[normText(m[3])]) unit = UNIT_ALIASES[normText(m[3])];
    } else { phrase = seg; }
    if (unit === 'g') { qty = qty / 1000; unit = 'kg'; } else if (unit === 'dkg') { qty = qty / 100; unit = 'kg'; }
    const mt = phrase ? matchProduct(phrase) : null;
    out.push({ raw: seg, qty: qty == null ? 1 : Math.round(qty * 100) / 100, unit: unit || (mt ? mt.p.unit : 'kg'), pid: mt ? mt.p.id : '', matched: !!mt, hadQty: qty != null });
  });
  return out;
}

  if (crateType && !(cq > 0)) { showStatus('⚠️ Hány db csere edényzet kell?'); return; }
  let vid = sel.value;
  if (vid === '__new__') {
    if (!pos) { showStatus('⚠️ Nincs GPS-jel, nem tudok tűt letenni. Válassz meglévő standot.'); return; }
    vid = createVendor($('bfNewName').value.trim() || 'Névtelen stand', pos.lat(), pos.lng());
  }
  const vname = (vendors[vid] && vendors[vid].name) || '';
  const crateQty = crateType ? cq : null, prev = it.buy;
  let purchaseId = prev && prev.purchaseId;
  if (purchaseId) updatePurchase(purchaseId, { vendorId: vid, vendorName: vname, price, unit, quantity: qty, crateType, crateQty });
  else purchaseId = savePurchase(vid, it.name, price, qty, unit, crateType, crateQty, todayStr(), true);
  it.done = true; it.buy = { vendorId: vid, vendorName: vname, price, unit, qty, crateType, crateQty, purchaseId, ts: Date.now() };
  saveSession();
  selectedStandId = vid; renderMarkers();
  const v = vendors[vid]; if (v && map) map.panTo({ lat: v.lat, lng: v.lng });
  if (sessionStats().done === sessionStats().total) { showStatus('🎉 Minden kipipálva!', 2500); renderSummary(); }
  else { closePanel(); showStatus('✓ ' + it.name + ' → ' + vname, 2500); }
}

/* ---------- ÖSSZESÍTŐ ---------- */
function groupByVendor(filterFn) {
  const g = {};
  SESSION.items.forEach(it => { if (it.done && it.buy && (!filterFn || filterFn(it))) { (g[it.buy.vendorId] = g[it.buy.vendorId] || { name: it.buy.vendorName, items: [] }).items.push(it); } });
  return g;
}
function crateTotals() {
  const t = {}; SESSION.items.forEach(it => { if (it.done && it.buy && it.buy.crateType) t[it.buy.crateType] = (t[it.buy.crateType] || 0) + Number(it.buy.crateQty || 0); });
  return t;
}
function renderSummary() {
  const g = groupByVendor(), ct = crateTotals(), pending = SESSION.items.filter(i => !i.done);
  let total = 0, html = '<h3>📊 Összesítő</h3>';
  Object.values(g).forEach(v => {
    let sub = 0;
    const rows = v.items.map(it => { const line = it.buy.price * it.buy.qty; sub += line; total += line;
      return '<tr><td>' + escapeHtml(it.name) + '</td><td>' + fmtQty(it.buy.qty) + ' ' + escapeHtml(unitLabel(it.buy.unit)) + '</td><td>' + fmtFt(line) + '</td></tr>'; }).join('');
    html += '<div class="vgroup"><h4>📍 ' + escapeHtml(v.name || '?') + '</h4><table class="sumtable"><tr><th>Termék</th><th>Menny.</th><th>Összeg</th></tr>' + rows +
      '<tr><td colspan="2"><b>Részösszeg</b></td><td><b>' + fmtFt(sub) + '</b></td></tr></table></div>';
  });
  const crateTxt = Object.keys(ct).length ? Object.entries(ct).map(([k, q]) => q + ' ' + unitLabel(k)).join(' + ') : '—';
  html += '<div class="stat-row"><div class="stat"><b>' + fmtFt(total) + '</b><small>összesen</small></div><div class="stat warn"><b>' + escapeHtml(crateTxt) + '</b><small>csere edényzet</small></div></div>';
  if (pending.length) html += '<div class="stat warn" style="margin:8px 0"><small>Még nincs megvéve (' + pending.length + '):</small><br><b style="font-size:14px">' + pending.map(i => escapeHtml(i.name)).join(', ') + '</b></div>';
  html += '<div class="mrow"><button class="go-btn ghost2" id="smBack">← Lista</button><button class="go-btn amber" id="smCollect">Összegyűjtés →</button></div>';
  $('panelContent').innerHTML = html; openPanel();
  $('smBack').onclick = renderChecklist;
  $('smCollect').onclick = () => {
    if (pending.length && !confirm(pending.length + ' tételt még nem vettetek meg. Biztosan továbblépsz az összegyűjtésre?')) return;
    SESSION.phase = 'collect'; saveSession(); renderCollect();
  };
}

/* ---------- ÖSSZEGYŰJTÉS-CHECKLIST (standonként) ---------- */
function renderCollect() {
  const g = groupByVendor(), st = sessionStats(), bought = SESSION.items.filter(i => i.done).length, pct = bought ? Math.round(st.coll * 100 / bought) : 0;
  let html = '<h3>📦 Összegyűjtés — ' + st.coll + '/' + bought + '</h3><div class="prog"><i style="width:' + pct + '%"></i></div>';
  Object.entries(g).forEach(([vid, v]) => {
    const cr = {}; v.items.forEach(it => { if (it.buy.crateType) cr[it.buy.crateType] = (cr[it.buy.crateType] || 0) + Number(it.buy.crateQty || 0); });
    const tag = Object.keys(cr).length ? '<span class="tag">🧺 vidd: ' + Object.entries(cr).map(([k, q]) => q + ' ' + unitLabel(k)).join(' + ') + '</span>' : '';
    html += '<div class="vgroup"><h4>📍 ' + escapeHtml(v.name || '?') + tag + '</h4>' + v.items.map(it => {
      const idx = SESSION.items.indexOf(it);
      return '<div class="crow' + (it.collected ? ' done' : '') + '" data-i="' + idx + '">' + thumbHtml(it) + '<div class="cmain"><b>' + escapeHtml(it.name) + '</b><small>' + fmtQty(it.buy.qty) + ' ' + escapeHtml(unitLabel(it.buy.unit)) + '</small></div><div class="ccheck">✓</div></div>';
    }).join('') + '</div>';
  });
  if (!Object.keys(g).length) html += '<p class="sub">Nincs megvásárolt tétel.</p>';
  html += '<div class="mrow" style="margin-top:12px"><button class="go-btn ghost2" id="clBack">← Összesítő</button>' + (bought && st.coll === bought ? '<button class="go-btn" id="clDone">Kész, mindent összegyűjtöttünk ✓</button>' : '') + '</div>';
  $('panelContent').innerHTML = html; openPanel();
  $('panelContent').querySelectorAll('.crow').forEach(el => el.addEventListener('click', () => {
    const it = SESSION.items[+el.dataset.i]; it.collected = !it.collected;
    if (it.buy && it.buy.purchaseId) toggleCollected(it.buy.purchaseId, it.collected);
    saveSession(); renderCollect();
  }));
  $('clBack').onclick = () => { SESSION.phase = 'shop'; saveSession(); renderSummary(); };
  if ($('clDone')) $('clDone').onclick = () => { SESSION.phase = 'collected'; saveSession(); renderCollectedDone(); };
  hydrateImages($('panelContent'));
}
function renderCollectedDone() {
  const ct = crateTotals(), n = SESSION.items.filter(i => i.done).length;
  $('panelContent').innerHTML = '<div style="text-align:center;padding:10px 0 6px"><div style="font-size:56px;animation:cardIn .6s var(--ease)">🎉</div><h3 style="margin-top:6px">Minden összegyűjtve!</h3>' +
    '<p class="sub" style="color:var(--muted)">' + n + ' tétel vár a komissiózásra.<br>A komissiózás, szállítás és számlázás a következő fázisban érkezik.</p></div>' +
    '<div class="mrow"><button class="go-btn ghost2" id="cdBack">← Összegyűjtés</button><button class="go-btn" id="cdHome">🏠 Kezdőlap</button></div>';
  openPanel();
  $('cdBack').onclick = () => { SESSION.phase = 'collect'; saveSession(); renderCollect(); };
  $('cdHome').onclick = () => showScreen('home');
}
showScreen('home');

</script>
