function invoiceHtml(o) {
  const rows = o.items.filter(it => Number(it.qty) > 0).map((it, k) => '<tr><td>' + (k + 1) + '</td><td>' + escapeHtml(it.name) + '</td><td class="r">' + fmtQty(it.qty) + '</td><td>' + escapeHtml(normUnit(it.unit)) + '</td><td class="r">' + fmtFt(Number(it.price) || 0) + '</td><td class="r">' + fmtFt((Number(it.qty) || 0) * (Number(it.price) || 0)) + '</td></tr>').join('');
  return '<div class="inv"><h1>Szállítólevél</h1><div class="meta"><div><b>' + escapeHtml(companyName()) + '</b></div><div>Dátum: ' + escapeHtml(DAY.date) + '</div></div>' +
    '<div class="meta"><div><b>Átvevő:</b> ' + escapeHtml(o.name || '—') + '<br>' + escapeHtml(o.address || '') + (o.note ? '<br><i>' + escapeHtml(o.note) + '</i>' : '') + '</div></div>' +
    '<table><thead><tr><th>#</th><th>Termék</th><th class="r">Menny.</th><th>Egység</th><th class="r">Egységár</th><th class="r">Összeg</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="tot">Összesen: ' + fmtFt(orderTotal(o)) + '</div>' +
    (cratesText(o) ? '<div class="cr"><b>Kiadott edényzet:</b> ' + escapeHtml(cratesText(o)) + '</div>' : '') +
    (balText(debtOf(o)) && o.status !== 'delivered' ? '<div class="cr"><b>Eddigi edényzet-tartozás:</b> ' + escapeHtml(balText(debtOf(o))) + '</div>' : '') + '<div class="sign"><div>Átadta</div><div>Átvette</div></div><div class="note">Szállítólevél / számlamelléklet — nem minősül hivatalos számlának.</div></div>';
}
function printOrders(list) {
  list = list.filter(o => o.items.some(it => Number(it.qty) > 0));
  if (!list.length) { showStatus('⚠️ Nincs nyomtatható tétel.'); return; }
  $('printArea').innerHTML = list.map(invoiceHtml).join('');
  setTimeout(() => window.print(), 80);
}

/* ---------- ESEMÉNYEK ---------- */
function updateDeliverSub() {
  const el = document.querySelector('#goDeliver small'); if (!el) return;
  const n = DAY.orders.length, r = DAY.orders.filter(o => o.status === 'ready').length;
  const dv = DAY.orders.filter(o => o.status === 'delivered').length;
  el.textContent = n ? n + ' cím · ' + (r + dv) + ' kész · ' + dv + ' kiszállítva' : 'Komissiózás címenként, szállítólevél';
}
$('goDeliver').addEventListener('click', () => showScreen('deliver'));
$('dlBack').addEventListener('click', () => showScreen('home'));
$('dlAdd').addEventListener('click', () => { DAY.orders.push(normDay({ orders: [{}] }).orders[0]); saveDay(); renderDelivery(); openOrder(DAY.orders.length - 1); });
$('dlPrintAll').addEventListener('click', () => printOrders(DAY.orders));

/* ================= v2.2 SZÁLLÍTÁS + EDÉNYZET-EGYENLEG ================= */
function addrIdOf(o) { return o.addrId || addrIdFor(o.name); }
function debtOf(o) { const a = ADDRS[addrIdOf(o)]; return (a && a.debt) || {}; }
function balText(d) {   // pozitív = tartozik nekünk, negatív = mi tartozunk nekik
  const p = [];
  CRATE_KEYS.forEach(k => { const v = Number(d[k[0]]) || 0; if (v > 0) p.push(v + ' ' + k[1].toLowerCase()); else if (v < 0) p.push('nekik jár ' + (-v) + ' ' + k[1].toLowerCase()); });
  return p.join(' · ');
}
function balTag(d) { const t = balText(d); if (!t) return ''; const neg = CRATE_KEYS.every(k => (Number(d[k[0]]) || 0) <= 0); return '<span class="debt-tag' + (neg ? ' neg' : '') + '">↩ ' + escapeHtml(t) + '</span>'; }
function saveAddrDebt(o, debt) {
  syncOrderAddress(o); const id = addrIdOf(o); if (!id) return false;
  ADDRS[id] = Object.assign({}, ADDRS[id], { debt }); saveAddrs();
  if (firebaseReady) db.ref('addressBook/' + id).set(ADDRS[id]);
  return true;
}

/* ---------- SZÁLLÍTÁS LISTA ---------- */
function renderRun() {
  const wrap = $('rnScroll'), os = DAY.orders, todo = [], done = [], draft = [];
  os.forEach((o, i) => (o.status === 'delivered' ? done : o.status === 'ready' ? todo : draft).push(i));
  let html = '<div class="del-stats"><div><b>' + todo.length + '</b><small>kiszállítandó</small></div><div><b>' + done.length + '</b><small>kiszállítva</small></div><div><b>' + draft.length + '</b><small>még nem kész</small></div></div>';
  if (!todo.length && !done.length) html += '<div class="del-intro"><h3>Még nincs szállításra kész cím</h3><p>A komissiózásnál jelöld a címeket „Szállításra kész”-nek.</p></div>';
  const card = (i) => {
    const o = os[i], dl = o.status === 'delivered';
    return '<div class="ocard' + (dl ? ' delivered' : '') + '" data-i="' + i + '" style="animation-delay:' + Math.min(i, 10) * 40 + 'ms"><div class="oh"><div class="on"><b>' + escapeHtml(o.name) + '</b><small>' + escapeHtml(o.address || 'cím nélkül') + '</small></div><span class="pill">' + (dl ? '✓ Kiszállítva' : 'Kiszállítandó') + '</span></div>' +
      '<div class="om"><span><b>' + o.items.length + '</b> tétel</span><span><b>' + fmtFt(orderTotal(o)) + '</b></span><span>📦 ' + (cratesText(o) ? escapeHtml(cratesText(o)) : 'nincs edényzet') + '</span></div>' +
      (balTag(debtOf(o)) ? '<div>' + balTag(debtOf(o)) + '</div>' : '') + '</div>';
  };
  if (todo.length) html += '<div class="rsec">Válaszd ki, melyiket viszed ki</div>' + todo.map(card).join('');
  if (done.length) html += '<div class="rsec">Kiszállítva</div>' + done.map(card).join('');
  if (draft.length) html += '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:14px">' + draft.length + ' cím még nincs szállításra készre jelölve.</p>';
  wrap.innerHTML = html;
  wrap.querySelectorAll('.ocard').forEach(el => el.addEventListener('click', () => openRun(+el.dataset.i)));
}
function openRun(i) {
  const o = DAY.orders[i], dl = o.status === 'delivered', d = debtOf(o);
  const items = o.items.filter(it => Number(it.qty) > 0).map(it => '<tr><td>' + escapeHtml(it.name) + '</td><td class="r">' + fmtQty(it.qty) + ' ' + escapeHtml(normUnit(it.unit)) + '</td></tr>').join('');
  const nav = o.address ? '<a class="navlink" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(o.address) + '">🧭 Navigáció</a>' : '';
  openModal('<div class="oedit"><h3>🚚 ' + escapeHtml(o.name) + '</h3><div style="color:var(--muted);font-size:14px">' + escapeHtml(o.address || '') + (o.note ? '<br><i>' + escapeHtml(o.note) + '</i>' : '') + '</div>' + nav +
    '<div class="rsec">Átadandó</div><table class="rtab">' + items + '</table><div class="otot"><span>Összesen</span><b>' + fmtFt(orderTotal(o)) + '</b></div>' +
    '<div class="bal-box">📦 Most kiadandó edényzet: <b>' + (cratesText(o) ? escapeHtml(cratesText(o)) : 'nincs') + '</b>' +
    '<div style="margin-top:6px">' + (dl ? 'Eddigi egyenleg a kiszállítás előtt: ' + (balText(o.debtBefore || {}) || 'rendezett') : 'Eddigi tartozás: ' + (balText(d) ? '<span class="big">' + escapeHtml(balText(d)) + '</span>' : 'nincs')) + '</div>' +
    (dl ? '<div style="margin-top:6px">Visszahozott: <b>' + (cratesText({ crates: o.returned || {} }) || 'semmi') + '</b><br>Egyenleg most: <span class="big">' + (balText(d) || 'rendezett') + '</span></div>' : '') + '</div>' +
    '<div class="mrow">' + (dl ? '<button class="go-btn ghost2" id="rnUndo">↩ Visszavonás</button>' : '<button class="go-btn ghost2" id="rnPrint">🖨️ Szállítólevél</button>') +
    (dl ? '<button class="go-btn" id="rnClose">Bezár</button>' : '<button class="go-btn" id="rnDeliver">Kiszállítva ✓</button>') + '</div></div>');
  if (dl) { $('rnClose').onclick = closeModal; $('rnUndo').onclick = () => undoDelivery(i); }
  else { $('rnPrint').onclick = () => printOrders([o]); $('rnDeliver').onclick = () => openReturn(i); }
}
function openReturn(i) {
  const o = DAY.orders[i], d = debtOf(o), ret = {};
  openModal('<div class="oedit"><h3>📦 Visszahozott edényzet — ' + escapeHtml(o.name) + '</h3><p class="sub" style="margin:0 0 8px">Mennyit hoztak vissza / adtak át nekünk ennél a címnél?</p>' +
    '<div class="crate-grid" id="rtCrates"></div><div class="bal-box" id="rtBal"></div>' +
    '<div class="mrow"><button class="go-btn ghost2" id="rtBack">← Vissza</button><button class="go-btn" id="rtOk">Mentés — kiszállítva</button></div></div>');
  const calc = () => {
    const nb = {}; CRATE_KEYS.forEach(k => { nb[k[0]] = (Number(d[k[0]]) || 0) + (Number(o.crates[k[0]]) || 0) - (ret[k[0]] || 0); });
    $('rtBal').innerHTML = 'Eddigi: <b>' + (balText(d) || 'rendezett') + '</b><br>+ most kiadtunk: <b>' + (cratesText(o) || 'semmit') + '</b><br>− visszahoztak: <b>' + (cratesText({ crates: ret }) || 'semmit') + '</b><br>Új egyenleg: <span class="big">' + (balText(nb) || 'rendezett ✓') + '</span>';
    return nb;
  };
  const el = $('rtCrates');
  el.innerHTML = CRATE_KEYS.map(k => { ret[k[0]] = 0; return '<div class="cstep"><small>' + k[1] + '</small><div class="cc"><button type="button" data-k="' + k[0] + '" data-d="-1">−</button><input type="number" inputmode="numeric" min="0" step="1" data-k="' + k[0] + '" value="0"><button type="button" data-k="' + k[0] + '" data-d="1">+</button></div></div>'; }).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { const k = b.dataset.k; ret[k] = Math.max(0, (ret[k] || 0) + (+b.dataset.d)); el.querySelector('input[data-k=' + k + ']').value = ret[k]; calc(); });
  el.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { ret[inp.dataset.k] = Math.max(0, parseInt(inp.value, 10) || 0); calc(); }));
  calc();
  $('rtBack').onclick = () => openRun(i);
  $('rtOk').onclick = () => {
    const nb = calc();
    if (!saveAddrDebt(o, nb)) { showStatus('⚠️ A címnek nincs neve.'); return; }
    o.debtBefore = JSON.parse(JSON.stringify(d)); o.returned = JSON.parse(JSON.stringify(ret)); o.status = 'delivered'; o.deliveredAt = Date.now();
    saveDay(); closeModal(); renderRun(); showStatus('✓ ' + o.name + ' kiszállítva', 2500);
  };
}
function undoDelivery(i) {
  const o = DAY.orders[i]; if (o.status !== 'delivered') return;
  saveAddrDebt(o, JSON.parse(JSON.stringify(o.debtBefore || {})));
  o.status = 'ready'; delete o.deliveredAt; saveDay(); closeModal(); renderRun();
}

/* ---------- KEZDŐ / KORRIGÁLT EGYENLEG A CÍM SZERKESZTŐBEN ---------- */
function renderDebtEditor(o) {
  const box = $('oeDebt'); if (!box) return;
  const d = debtOf(o);
  box.innerHTML = '<div class="crate-grid">' + CRATE_KEYS.map(k => '<div class="cstep"><small>' + k[1] + '</small><div class="cc"><input type="number" inputmode="numeric" step="1" data-k="' + k[0] + '" value="' + (Number(d[k[0]]) || 0) + '" style="width:64px"></div></div>').join('') + '</div>' +
    '<p style="font-size:12px;color:var(--muted);margin:4px 2px 0">Pozitív szám: nálunk nem lévő, náluk levő edény (tartozik). Negatív: nekik jár.</p>';
  box.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => {
    if (!o.name.trim()) { showStatus('⚠️ Előbb add meg a cím nevét!'); inp.value = 0; return; }
    const nd = Object.assign({}, debtOf(o)); box.querySelectorAll('input').forEach(x => { nd[x.dataset.k] = parseInt(x.value, 10) || 0; });
    saveAddrDebt(o, nd);
  }));
}

$('rnBack').addEventListener('click', () => showScreen('deliver'));
$('dlRun').addEventListener('click', () => showScreen('run'));

/* ================= v2.3 NAPI ARCHÍVUM + RIPORTOK ================= */
let ARCH = {};
try { ARCH = JSON.parse(localStorage.getItem('piaci_archive') || '{}') || {}; } catch (e) { ARCH = {}; }
let archTimer = null;
function archiveToday() {
  const d = todayStr();
  const shop = (SESSION && SESSION.date === d) ? SESSION.items.filter(i => i.done && i.buy) : [];
  const e = JSON.parse(JSON.stringify({ date: d, orders: (DAY && DAY.date === d) ? DAY.orders : [], shop, updated: Date.now() }));
  if (!e.orders.length && !e.shop.length) return;
  ARCH[d] = e;
  try { localStorage.setItem('piaci_archive', JSON.stringify(ARCH)); } catch (x) { /* ignore */ }
  clearTimeout(archTimer);
  archTimer = setTimeout(() => { if (firebaseReady) db.ref('archive/' + d).set(ARCH[d]); }, 1500);
}
const _saveDay0 = saveDay; saveDay = function () { _saveDay0(); archiveToday(); };
const _saveSession0 = saveSession; saveSession = function () { _saveSession0(); archiveToday(); };

let repDays = 7;
function loadRemoteArchive(cb) {
  if (!firebaseReady) { cb(); return; }
  db.ref('archive').once('value').then(snap => {
    const v = snap.val() || {};
    Object.keys(v).forEach(k => { if (!ARCH[k] || (v[k].updated || 0) > (ARCH[k].updated || 0)) ARCH[k] = v[k]; });
    try { localStorage.setItem('piaci_archive', JSON.stringify(ARCH)); } catch (x) { /* ignore */ }
    cb();
  }).catch(cb);
}
function repEntries() {
  const from = repDays ? new Date(Date.now() - repDays * 864e5).toISOString().slice(0, 10) : '0000';
  return Object.keys(ARCH).filter(k => k >= from).sort().map(k => ARCH[k]);
}
function repLive(o) { return o.status === 'ready' || o.status === 'delivered'; }
function barRows(rows, fmt) {
  const max = Math.max.apply(null, rows.map(r => r.v)) || 1;
  return rows.map(r => '<div class="brow"><div class="bl"><span>' + escapeHtml(r.l) + '</span><span>' + fmt(r) + '</span></div><div class="bar"><i style="width:' + Math.max(3, Math.round(r.v * 100 / max)) + '%"></i></div></div>').join('');
}
function renderReport() {
  const es = repEntries(), wrap = $('rpScroll');
  let rev = 0, cost = 0, nOrd = 0, nDel = 0; const byAddr = {}, byProd = {}, buys = {};
  es.forEach(e => {
    (e.orders || []).filter(repLive).forEach(o => {
      nOrd++; if (o.status === 'delivered') nDel++;
      const t = (o.items || []).reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
      rev += t; const a = byAddr[o.name || '?'] = byAddr[o.name || '?'] || { v: 0, n: 0 }; a.v += t; a.n++;
      (o.items || []).forEach(it => {
        const k = it.pid + '|' + normUnit(it.unit), p = byProd[k] = byProd[k] || { l: it.name, unit: normUnit(it.unit), q: 0, v: 0 };
        p.q += Number(it.qty) || 0; p.v += (Number(it.qty) || 0) * (Number(it.price) || 0);
      });
    });
    (e.shop || []).forEach(it => {
      const b = it.buy; if (!b) return;
      cost += (Number(b.price) || 0) * (Number(b.qty) || 0);
      const k = it.pid + '|' + normUnit(b.unit), x = buys[k] = buys[k] || { name: it.name, unit: normUnit(b.unit), list: [] };
      x.list.push({ date: e.date, price: Number(b.price) || 0, qty: Number(b.qty) || 0, vendor: b.vendorName || '?' });
    });
  });
  const margin = rev - cost;
  let html = '<div class="kpis"><div class="kpi"><b>' + fmtFt(rev) + '</b><small>Eladási forgalom</small></div><div class="kpi"><b>' + fmtFt(cost) + '</b><small>Beszerzési költség</small></div>' +
    '<div class="kpi' + (margin < 0 ? ' neg' : '') + '"><b>' + fmtFt(margin) + '</b><small>Becsült árrés</small></div><div class="kpi"><b>' + nDel + '/' + nOrd + '</b><small>Kiszállítva / kész szállítás</small></div></div>';
  if (!es.length) html += '<div class="rcard"><div class="none">Még nincs mentett adat ebben az időszakban. A napi lista és a szállítások automatikusan archiválódnak.</div></div>';
  const addrRows = Object.keys(byAddr).map(k => ({ l: k, v: byAddr[k].v, n: byAddr[k].n })).sort((a, b) => b.v - a.v).slice(0, 12);
  html += '<div class="rcard"><h4>🏠 Forgalom címenként</h4>' + (addrRows.length ? barRows(addrRows, r => fmtFt(r.v) + ' · ' + r.n + ' szállítás') : '<div class="none">Nincs adat.</div>') + '</div>';
  const prodRows = Object.keys(byProd).map(k => byProd[k]).sort((a, b) => b.v - a.v).slice(0, 12);
  html += '<div class="rcard"><h4>🥕 Legtöbbet értékesített termékek</h4>' + (prodRows.length ? barRows(prodRows, r => fmtQty(r.q) + ' ' + r.unit + ' · ' + fmtFt(r.v)) : '<div class="none">Nincs adat.</div>') + '</div>';
  const buyRows = Object.keys(buys).map(k => buys[k]).sort((a, b) => b.list.length - a.list.length).slice(0, 15).map(x => {
    const L = x.list.slice().sort((a, b) => a.date.localeCompare(b.date)), tq = L.reduce((s, y) => s + y.qty, 0) || 1;
    const avg = L.reduce((s, y) => s + y.price * y.qty, 0) / tq, min = L.reduce((m, y) => y.price < m.price ? y : m, L[0]);
    const first = L[0].price, last = L[L.length - 1].price, ch = L.length > 1 && first ? Math.round((last - first) * 100 / first) : null;
    return '<tr><td><b>' + escapeHtml(x.name) + '</b><br><small style="color:var(--muted)">' + L.length + '× · ' + escapeHtml(min.vendor) + '</small></td><td class="r">' + fmtFt(avg) + '<br><small style="color:var(--muted)">/' + escapeHtml(x.unit) + '</small></td><td class="r">' + fmtFt(min.price) + '</td><td class="r">' + (ch === null ? '—' : '<span class="' + (ch > 0 ? 'up' : ch < 0 ? 'dn' : '') + '">' + (ch > 0 ? '▲' : ch < 0 ? '▼' : '=') + ' ' + Math.abs(ch) + '%</span>') + '</td></tr>';
  }).join('');
  html += '<div class="rcard"><h4>🛒 Beszerzési árak</h4>' + (buyRows ? '<table class="ptab"><thead><tr><th>Termék</th><th class="r">Átlag</th><th class="r">Legolcsóbb</th><th class="r">Változás</th></tr></thead><tbody>' + buyRows + '</tbody></table>' : '<div class="none">Nincs adat.</div>') + '</div>';
  const dRows = Object.keys(ADDRS).map(k => ADDRS[k]).filter(a => a && a.debt && balText(a.debt)).sort((a, b) => String(a.name).localeCompare(String(b.name), 'hu'));
  html += '<div class="rcard"><h4>📦 Edényzet-egyenleg címenként</h4>' + (dRows.length ? '<table class="ptab"><tbody>' + dRows.map(a => '<tr><td><b>' + escapeHtml(a.name) + '</b></td><td class="r">' + escapeHtml(balText(a.debt)) + '</td></tr>').join('') + '</tbody></table>' : '<div class="none">Minden egyenleg rendezett.</div>') + '</div>';
  wrap.innerHTML = html;
}
function exportCsv() {
  const rows = [['Dátum', 'Cím', 'Termék', 'Mennyiség', 'Egység', 'Egységár', 'Összeg', 'Státusz']];
  repEntries().forEach(e => (e.orders || []).filter(repLive).forEach(o => (o.items || []).forEach(it => rows.push([e.date, o.name, it.name, String(it.qty).replace('.', ','), normUnit(it.unit), it.price, Math.round((Number(it.qty) || 0) * (Number(it.price) || 0)), o.status === 'delivered' ? 'kiszállítva' : 'kész']))));
  if (rows.length < 2) { showStatus('⚠️ Nincs exportálható adat.'); return; }
  const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'szallitasok_' + todayStr() + '.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
$('goReport').addEventListener('click', () => { showScreen('report'); loadRemoteArchive(() => { if (document.body.dataset.screen === 'report') renderReport(); }); });
$('rpBack').addEventListener('click', () => showScreen('home'));
$('rpCsv').addEventListener('click', exportCsv);
$('rpChips').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return; repDays = +b.dataset.d;
  $('rpChips').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); renderReport();
});
archiveToday();

showScreen('home');
